name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon0 libgl1

      - name: Installer Poetry et les dépendances du projet
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --with=dev --extras enhance --verbose

      - name: Lint (ruff)
        run: poetry run ruff check src tests

      - name: Types (mypy)
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest tests -q
